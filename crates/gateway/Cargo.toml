[package]
name = "arca-lake-gateway"
description = "S3-compatible gateway for arca-lake"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
s3s.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
hyper-util = { workspace = true, features = ["server-auto", "server-graceful", "http1", "http2", "tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["process", "fs", "io-util"] }
tempfile.workspace = true
serde_json.workspace = true
uuid.workspace = true

[lints]
workspace = true
