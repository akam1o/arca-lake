[package]
name = "arca-lake-testkit"
description = "In-process cluster harness, fault injection, and fixtures for arca-lake tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Run the end-to-end suite on FoundationDB (`tests/e2e_fdb.rs`).
fdb = ["arca-lake-metadata/fdb"]

[dependencies]
arca-lake-common.workspace = true
arca-lake-controller.workspace = true
arca-lake-gateway.workspace = true
arca-lake-metadata.workspace = true
arca-lake-protocol.workspace = true
arca-lake-storage.workspace = true
arca-lake-storage-node.workspace = true
s3s.workspace = true
http.workspace = true
tonic = { workspace = true, features = ["codegen", "channel", "transport"] }
bytes.workspace = true
serde_json.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }
tempfile.workspace = true
uuid.workspace = true

[[test]]
name = "e2e_fdb"
required-features = ["fdb"]

[[test]]
name = "faults_fdb"
required-features = ["fdb"]

[[test]]
name = "fdb_failover"
required-features = ["fdb"]

[lints]
workspace = true
