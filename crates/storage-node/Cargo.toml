[package]
name = "arca-lake-storage-node"
description = "Storage node service wrapping the arca-lake storage engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# Test-only: storage I/O faults driven by a control file (soak tests).
fault-injection = []

[dependencies]
tracing.workspace = true
arca-lake-common.workspace = true
arca-lake-storage.workspace = true
rustix.workspace = true
arca-lake-protocol.workspace = true
tonic = { workspace = true, features = ["codegen", "server", "channel", "transport", "router"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
bytes.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
arca-lake-protocol = { workspace = true, features = ["pki"] }

[lints]
workspace = true
