[package]
name = "arca-lake-metadata"
description = "Metadata store abstraction, key layout, and transaction recipes for arca-lake"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# FoundationDB backend. Requires the FoundationDB client library
# (libfdb_c) at build and run time; see deploy/dev/README.md.
fdb = ["dep:foundationdb"]

[dependencies]
arca-lake-common.workspace = true
thiserror.workspace = true
foundationdb-tuple.workspace = true
foundationdb = { workspace = true, optional = true }
serde.workspace = true
postcard.workspace = true
uuid.workspace = true

[dev-dependencies]
futures.workspace = true
proptest.workspace = true

[[test]]
name = "fdb"
required-features = ["fdb"]

[lints]
workspace = true
