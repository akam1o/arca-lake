[package]
name = "arca-lake"
description = "arca-lake command-line entry point: gateway, storage-node, controller, and admin subcommands"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "arca-lake"
path = "src/main.rs"

[features]
default = []
# FoundationDB metadata backend for multi-process deployments.
fdb = ["arca-lake-metadata/fdb"]
# Test-only build reporting (P + 1, M + 1, F + 1) for the mixed-version
# tests (RFC-014 §5.7, ADR-0016). Never ship a binary built with this.
version-bump = ["arca-lake-common/version-bump"]
# Test-only fault controls: storage I/O faults on storage nodes (soak
# tests); tiering-refresh faults on gateways and a hold of tiering moves on
# controllers (ADR-0035 integration harness). Never ship a binary built
# with this.
fault-injection = [
    "arca-lake-storage-node/fault-injection",
    "arca-lake-gateway/fault-injection",
    "arca-lake-controller/fault-injection",
]

[dependencies]
libc.workspace = true
arca-lake-common.workspace = true
arca-lake-controller.workspace = true
arca-lake-gateway.workspace = true
arca-lake-metadata.workspace = true
arca-lake-protocol = { workspace = true, features = ["pki"] }
arca-lake-storage-node.workspace = true
arca-lake-storage.workspace = true
arca-lake-tiering.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "process"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
