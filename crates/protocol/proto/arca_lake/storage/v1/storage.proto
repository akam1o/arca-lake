// arca-lake storage node API, protocol version 1.
//
// Every request carries `protocol_version` so that a node can refuse
// messages from a future incompatible version explicitly. Write-side
// requests carry the stripe group epoch; a node that has been told a
// higher epoch for the group rejects them with FAILED_PRECONDITION and the
// message "epoch rejected" (fencing, RFC-004 §5.4). All RPCs are idempotent.

syntax = "proto3";

package arca_lake.storage.v1;

// Identity of a shard on a device.
message ShardKey {
  uint64 group_id = 1;
  bytes chunk_id = 2;   // 16 bytes: generation prefix (12) + chunk index (4, big endian)
  uint32 shard_index = 3;
}

message PutShardHeader {
  uint32 protocol_version = 1;
  ShardKey key = 2;
  // Placement epoch of the stripe group at write time.
  uint64 group_epoch = 3;
  uint64 payload_len = 4;
  // What the write is for (Phase 3.6 capacity admission): the node keeps a
  // reserve that client writes may not use and repair may. Older callers
  // send CLIENT.
  WriteClass write_class = 5;
  // Cluster incarnation of the writer (R-117): a node that has adopted an
  // incarnation refuses a write carrying a different one, so a shard sent
  // to a node of another cluster (an address reused) is never counted
  // written. Empty is accepted (a writer that holds none, or predates it).
  bytes incarnation = 6;
}

enum WriteClass {
  WRITE_CLASS_CLIENT = 0;
  WRITE_CLASS_REPAIR = 1;
  WRITE_CLASS_MIGRATION = 2;
  WRITE_CLASS_CACHE = 3;
}

// Capacity of one device of a node (Phase 3.6). Bytes.
message DeviceCapacity {
  // File system size and bytes available to the node (statvfs, capped by
  // the node's configured capacity).
  uint64 total_bytes = 1;
  uint64 available_bytes = 2;
  // Segment files on the device, and the live payload in them; the
  // difference is reclaimable by compaction.
  uint64 allocated_bytes = 3;
  uint64 live_bytes = 4;
  uint64 reclaimable_bytes = 5;
  uint64 quarantined_bytes = 6;
  // Kept free for compaction output, segment rollover, quarantine and
  // repair: client writes stop above it.
  uint64 reserved_bytes = 7;
  // Admitted writes not yet stored.
  uint64 inflight_bytes = 8;
  // Free bytes repair may still use (the floor client writes stop at is
  // reserved_bytes; repair stops at this one).
  uint64 repair_floor_bytes = 9;
  // When the node sampled these, unix ms.
  uint64 sampled_unix_ms = 10;
  // Capacity domain (Phase 3.7): the file system the free space comes
  // from. Nodes with equal ids draw on one file system. Empty = unknown.
  string domain_id = 11;
  // Whether sharing would always show as equal ids (false for overlay,
  // FUSE and network file systems).
  bool domain_certain = 12;
  // The node has an allotment (--capacity-bytes): total_bytes is it.
  bool allotted = 13;
  // The file system's own size (not capped by the allotment).
  uint64 fs_total_bytes = 14;
  // Delete reserve (Phase 3.8): kept for the tombstones of deleting every
  // record held; reserved_bytes and repair_floor_bytes include it.
  uint64 delete_reserve_bytes = 15;
  // Bytes of the store's files other than segments (quarantine log,
  // sequence bound, temporary files).
  uint64 side_file_bytes = 16;
}

// Client-streaming body: one header followed by data frames.
message PutShardRequest {
  oneof body {
    PutShardHeader header = 1;
    bytes data = 2;
  }
}

message PutShardResponse {
  uint32 crc32c = 1;
  uint64 bytes_received = 2;
  // The stored record's sequence on this node (0 from an older node): what
  // a conditional DeleteShard of this write names.
  uint64 sequence = 3;
  // The node store's epoch: with `sequence`, the delete token of this write.
  uint64 store_epoch = 4;
}

message GetShardRequest {
  uint32 protocol_version = 1;
  ShardKey key = 2;
  uint64 offset = 3;
  // 0 means "to the end of the shard".
  uint64 len = 4;
}

message GetShardResponse {
  bytes data = 1;
}

message DeleteShardRequest {
  uint32 protocol_version = 1;
  ShardKey key = 2;
  uint64 group_epoch = 3;
  // Cluster incarnation of the caller (RFC-015 §5.3, ADR-0016). A node
  // that has adopted an incarnation rejects a different one; empty is
  // accepted (a caller that predates incarnations).
  bytes incarnation = 4;
  // Non-zero: delete only if the key's newest record on the node has this
  // sequence (from ListShards or PutShard); otherwise ABORTED and nothing
  // changes. A delete decided on what a caller saw cannot remove a record
  // written since under the same key (Phase 3.5). An older node ignores
  // it and deletes unconditionally.
  uint64 if_sequence = 5;
  // With `if_sequence`: the store epoch the token was handed out under. A
  // node whose store took another epoch (it lost track of the sequences it
  // handed out) answers ABORTED.
  uint64 if_store_epoch = 6;
  // Delete fence generation the caller deletes under (Phase 3.8, ADR-0023).
  // Protocol version 3 and later: the node deletes only while its fence is
  // open at exactly this generation, checked under the same lock as the
  // store's delete; 0 (absent) is refused.
  uint64 delete_fence = 7;
  // The identity the caller expects at this address (Phase 3.11, R-100):
  // the node id and the token the node acknowledged (empty = not
  // carried). A node holding another identity, or none, refuses: a delete
  // decided for one node never runs on another disk at its address.
  uint64 node_id = 8;
  bytes node_identity = 9;
}

message DeleteShardResponse {
  // Phase 3.12 (ADR-0028): the record was retired, not removed: it stays
  // readable until a `ReclaimShard`. An earlier node answers false.
  bool deferred = 1;
}

// Reclaim a retired record (Phase 3.12, ADR-0028). The node removes it only
// if it retired exactly `sequence`, the key's newest record is still that
// sequence, and `observed_at_ms` (the caller's clock, taken before the
// metadata read that found the shard unneeded) is at least the node's
// retention after the retirement. The incarnation, fence and identity
// checks are those of `DeleteShard`.
message ReclaimShardRequest {
  uint32 protocol_version = 1;
  ShardKey key = 2;
  uint64 group_epoch = 3;
  bytes incarnation = 4;
  uint64 sequence = 5;
  uint64 store_epoch = 6;
  uint64 delete_fence = 7;
  uint64 node_id = 8;
  bytes node_identity = 9;
  uint64 observed_at_ms = 10;
  // Phase 3.12 (review): the record is needed (the caller's metadata
  // places it): its retirement ends, the record stays. Always safe (it only
  // keeps data); a later delete retires it anew. A retirement of an earlier
  // incarnation needed by restored metadata would otherwise stay pending
  // for good.
  bool keep = 11;
}
message ReclaimShardResponse {
  // Phase 3.13: payload bytes of the record removed (0: kept, gone
  // already, or an earlier release).
  uint64 payload_bytes = 1;
}

// Retired records in key order (Phase 3.12, ADR-0028).
message ListPendingRequest {
  uint32 protocol_version = 1;
  ShardKey after = 2;
  uint32 limit = 3;
  // Phase 3.13 (R-106): only records due by the node's clock (retired at
  // least its retention ago); one call looks at a bounded number of
  // records, so a page may be short or empty with `next` set.
  bool due_only = 4;
}
message PendingShard {
  ShardKey key = 1;
  uint64 sequence = 2;
  uint64 retired_at_ms = 3;
  uint64 store_epoch = 4;
}
message ListPendingResponse {
  repeated PendingShard shards = 1;
  ShardKey next = 2;
  // The node's retention (ms).
  uint64 retention_ms = 3;
}

// Paged listing. Entries are returned in key order (chunk_id, shard_index)
// strictly after `after` when `after` is set. Each page is a snapshot of the
// node's index at the time of the call: a shard written after a page was
// served and sorting before the cursor is not seen by this walk, and a shard
// deleted meanwhile may still be listed. Walkers must tolerate both
// (RFC-008 §6.5).
message ListShardsRequest {
  uint32 protocol_version = 1;
  uint64 group_id = 2;
  ShardKey after = 3;
  // 0 means the node's default page size.
  uint32 limit = 4;
  // Also list quarantined shards (RFC-008 §8.2); they carry
  // `quarantined = true`. Reconciliation uses this; readers and repair do not.
  bool include_quarantined = 5;
}

message ShardEntry {
  ShardKey key = 1;
  uint64 payload_len = 2;
  bool quarantined = 3;
  // The record's sequence on this node (0 from an older node).
  uint64 sequence = 4;
  // The node store's epoch (see DeleteShardRequest.if_store_epoch).
  uint64 store_epoch = 5;
  // Phase 3.12 (ADR-0028): retired at this sequence by a delete of the
  // incarnation the node holds (deleting it again changes nothing; a
  // retirement of an earlier incarnation is not flagged: a delete under
  // this one restarts it). An earlier node answers false.
  bool retired = 6;
  // Phase 3.12 (review): retired at this sequence under any incarnation.
  // A member move counts such a record as absent and writes the shard
  // again (a new sequence ends the retirement): a former member made a
  // member again must not need a retired record unchanged (ADR-0028 H4).
  bool retired_any = 7;
}

message ListShardsResponse {
  reserved 1;
  repeated ShardEntry entries = 2;
  // Set when more entries may follow; pass it as `after`.
  ShardKey next = 3;
  bool more = 4;
}

// Read and verify shards (block checksums) in key order after `after`.
message VerifyShardsRequest {
  uint32 protocol_version = 1;
  uint64 group_id = 2;
  ShardKey after = 3;
  uint32 limit = 4;
  // Report corrupt shards without quarantining them (read-only
  // verification). Honoured by nodes whose Health says
  // `verify_read_only`; older nodes ignore it and quarantine.
  bool read_only = 5;
  // Phase 3.14 (differential verification): when `since_store_epoch` is
  // the node's store epoch, records below `since_sequence` are not read
  // again (not reported); otherwise, or when 0, every record is verified.
  uint64 since_sequence = 6;
  uint64 since_store_epoch = 7;
}

message ShardVerification {
  ShardKey key = 1;
  uint64 payload_len = 2;
  // CRC-32C of the payload; meaningful only when `ok`.
  uint32 crc32c = 3;
  // False when the stored bytes failed verification (the node has
  // quarantined the shard, so later reads report it missing).
  bool ok = 4;
}

message VerifyShardsResponse {
  repeated ShardVerification shards = 1;
  ShardKey next = 2;
  bool more = 3;
  // Phase 3.14: the node's store epoch, and a sequence below which every
  // existing record was in the index when this page was listed (0 from an
  // earlier release: no differential verification).
  uint64 store_epoch = 4;
  uint64 indexed_below = 5;
  // Whether `since_sequence` was applied to this page.
  bool since_applied = 6;
}

// Deep verification of a page of shards (RFC-008 §8.2): every shard is read
// in full and classified; corrupt shards are quarantined durably on the node.
// Quarantined shards of the window are reported with their status.
message ScrubShardsRequest {
  uint32 protocol_version = 1;
  uint64 group_id = 2;
  ShardKey after = 3;
  uint32 limit = 4;
  // Stop after the shard whose bytes bring the page past this many payload
  // bytes (0 = no byte bound); the page then reports `more`. Bounds the
  // burst a scrub puts on the device between two pacing sleeps.
  uint64 max_bytes = 5;
}

enum ShardStatus {
  SHARD_STATUS_UNSPECIFIED = 0;
  SHARD_STATUS_OK = 1;
  SHARD_STATUS_CHECKSUM_MISMATCH = 2;
  SHARD_STATUS_INVALID_HEADER = 3;
  SHARD_STATUS_TRUNCATED = 4;
  SHARD_STATUS_QUARANTINED = 5;
  SHARD_STATUS_IO_ERROR = 6;
}

message ShardScrub {
  ShardKey key = 1;
  uint64 payload_len = 2;
  // CRC-32C of the payload; meaningful only when OK.
  uint32 crc32c = 3;
  uint64 sequence = 4;
  ShardStatus status = 5;
  string reason = 6;
}

message ScrubShardsResponse {
  repeated ShardScrub shards = 1;
  ShardKey next = 2;
  bool more = 3;
  uint64 bytes_read = 4;
}

message UpdateGroupEpochRequest {
  uint32 protocol_version = 1;
  uint64 group_id = 2;
  uint64 epoch = 3;
}

message UpdateGroupEpochResponse {
  // The epoch the node now enforces (max of known and requested).
  uint64 epoch = 1;
}

// Also the controller's channel to the node for cluster facts the node
// cannot read itself (RFC-014 §5.3, RFC-015 §5.3): every field is optional
// and a zero value means "not carried".
message HealthRequest {
  // Storage format nodes may write; 0 = not carried.
  uint64 format_write = 1;
  // Cluster incarnation with the cluster state's change time; the node
  // adopts a value only when `incarnation_changed_ms` is not older than
  // what it holds.
  bytes incarnation = 2;
  uint64 incarnation_changed_ms = 3;
  // Delete fence (ADR-0023); generation 0 = not carried. A node adopts a
  // higher generation (open or closed), or the closing of its own; never
  // reopens a generation, never goes back to a lower one.
  uint64 delete_fence_generation = 4;
  bool delete_fence_open = 5;
  // A closed fence with an operator hold (before a restore, maintenance):
  // the node then opens a fence again only on `delete_fence_release`, or
  // from a caller of another incarnation than the one it was held in (the
  // restored cluster after `recovery begin`). A controller started on
  // restored metadata before `recovery begin` cannot reopen deletes.
  bool delete_fence_hold = 6;
  bool delete_fence_release = 7;
  // With a release of a node whose facts were lost (unknown hold): the
  // token the node reports in `delete_fence_unknown_token`, so that a
  // release sent before the loss cannot lift it.
  uint64 delete_fence_release_token = 8;
  // Sequence of `incarnation` (Phase 3.10, R-92; 0 = not carried): a node
  // that holds a sequence adopts only an incarnation of a higher one, and
  // never orders incarnations by `incarnation_changed_ms` again.
  uint64 incarnation_seq = 9;
  // Metadata schema the cluster runs at (Phase 3.10, 0 = not carried): the
  // node keeps the highest it saw, so that `recovery begin` can bring
  // restored metadata back up to it (a restore must not reopen a downgrade
  // that `upgrade finalize` closed).
  uint64 schema_floor = 10;
  // Who opened `delete_fence_generation` (Phase 3.10 review, with
  // `delete_fence_open`): a value the opening controller process drew at
  // its start (0 = not carried, an earlier release's). A node holding that
  // generation open from another opener takes the push as a conflict and
  // closes it: two clusters (one restored) that opened the same generation
  // number never renew each other's lease.
  uint64 delete_fence_opener = 11;
  // The node's identity (Phase 3.11, R-100): the id the cluster registered
  // it under and the random token it was given (empty = not carried).
  uint64 node_id = 12;
  bytes node_identity = 13;
  // Adopt the identity if the node holds none (sent only until the node
  // acknowledged one; afterwards the identity is only compared, so that an
  // emptied or swapped disk never takes it silently).
  bool adopt_identity = 14;
}

message GroupEpoch {
  uint64 group_id = 1;
  uint64 epoch = 2;
}

message HealthResponse {
  uint64 live_shards = 1;
  uint64 live_bytes = 2;
  uint64 segment_bytes = 3;
  uint64 quarantined_shards = 4;
  uint64 quarantined_bytes = 5;
  // Capabilities (RFC-014 §5.1). Absent (0) on nodes that predate them,
  // which readers treat as (1, 1).
  uint32 protocol_min = 6;
  uint32 protocol_max = 7;
  uint64 format_min = 8;
  uint64 format_max = 9;
  // Format this node stamps on new segments now.
  uint64 format_write = 10;
  // Incarnation the node has adopted (empty = none yet).
  bytes incarnation = 11;
  string software = 12;
  // Every group epoch the node enforces (RFC-015 §5.4 epoch catch-up).
  repeated GroupEpoch group_epochs = 13;
  // Test-only additive field of the version-bump build (ADR-0016).
  uint64 version_bump = 14;
  // Client load right now (repair yields to it, RFC-008 §8.5 budgets).
  uint64 puts_in_flight = 15;
  uint64 gets_in_flight = 16;
  // Device space (statvfs of the store directory): bytes available to the
  // node and the file system size. 0 = unknown (older nodes); placement
  // of replacements then cannot check capacity.
  uint64 device_free_bytes = 17;
  uint64 device_total_bytes = 18;
  // The node honours VerifyShardsRequest.read_only.
  bool verify_read_only = 19;
  // Phase 3.6: per device capacity (one entry per store device).
  repeated DeviceCapacity devices = 27;
  // Load of the recent window (ADR-0018, adaptive background work):
  // p99 of GetShard serve and PutShard store time, µs (0 = no request).
  uint64 load_get_p99_us = 20;
  uint64 load_put_p99_us = 21;
  // Device statistics of the window, when the platform has them.
  bool load_device = 22;
  uint32 load_device_util_permille = 23;
  uint32 load_device_queue_depth_milli = 24;
  // The node's delete fence (ADR-0023): generation (0 = none adopted) and
  // whether deletes under it are allowed.
  uint64 delete_fence_generation = 28;
  bool delete_fence_open = 29;
  bool delete_fence_hold = 30;
  // Non-zero while the node holds its fence because its facts were lost or
  // damaged: what a release must carry (drawn at each start).
  uint64 delete_fence_unknown_token = 31;
  // Milliseconds left of the node's rejoin lease on its open fence (Phase
  // 3.10): 0 = deletes refused until the leader pushes the fence again
  // (after a start, a partition or a lapse of the leader's pushes).
  uint64 delete_fence_lease_ms = 32;
  // Sequence of the incarnation the node adopted (0 = none known).
  uint64 incarnation_seq = 33;
  // The highest metadata schema the node was told (0 = none).
  uint64 schema_floor = 34;
  // Newest segment format on the device (Phase 3.10): the finalize waits
  // until it reaches the target (the previous release refuses such a
  // store).
  uint64 newest_segment_format = 36;
  // The identity the node holds on its disk (Phase 3.11, R-100; older
  // nodes: identity_supported false). A request whose identity differs
  // (another cluster, a reused id, another disk) changes nothing on the
  // node: identity_mismatch.
  bool identity_supported = 37;
  uint64 identity_node_id = 38;
  bytes identity_token = 39;
  bool identity_mismatch = 40;
  // The incarnation the operator hold is tied to (Phase 3.11): only a
  // caller of a later incarnation the node adopted lifts it. 16 bytes of
  // 0xff: unknown (facts lost; only a release lifts it); zeros: set
  // before the node had an incarnation; empty: no hold, or an earlier
  // release that does not report it.
  bytes delete_fence_hold_incarnation = 41;
  // Deferred reclamation (Phase 3.12, ADR-0028): the retention (ms; 0:
  // deletes are not deferred, or an earlier release), the retired records,
  // and whether the node's retirement state is damaged (nothing reclaimed).
  uint64 reclaim_retention_ms = 42;
  uint64 reclaim_pending = 43;
  bool reclaim_damaged = 44;
  // The clock skew the node allows a reclaim's observation (ms, ADR-0028
  // H2): `admin restore` bounds a backup's age by the retention less twice
  // this.
  uint64 reclaim_skew_ms = 45;
  // Payload bytes of the retired records (Phase 3.13): still on the device
  // (counted as used by device_free_bytes) until reclaimed. 0 from an
  // earlier release.
  uint64 reclaim_retained_bytes = 46;
  uint32 load_device_read_await_us = 25;
  // The node reports the load fields above (older nodes: false, and their
  // zeros mean "unknown", not "idle").
  bool load_reported = 26;
  // Newest metadata schema whose protections the node enforces (0.2.0,
  // ADR-0039: 5). 0 from 0.1.0 and earlier: such a node blocks a finalize
  // to schema 5 and is reported as below it afterwards.
  uint64 schema_max = 50;
}

service StorageNode {
  rpc PutShard(stream PutShardRequest) returns (PutShardResponse);
  rpc GetShard(GetShardRequest) returns (stream GetShardResponse);
  rpc DeleteShard(DeleteShardRequest) returns (DeleteShardResponse);
  rpc ReclaimShard(ReclaimShardRequest) returns (ReclaimShardResponse);
  rpc ListPending(ListPendingRequest) returns (ListPendingResponse);
  rpc ListShards(ListShardsRequest) returns (ListShardsResponse);
  rpc VerifyShards(VerifyShardsRequest) returns (VerifyShardsResponse);
  rpc ScrubShards(ScrubShardsRequest) returns (ScrubShardsResponse);
  rpc UpdateGroupEpoch(UpdateGroupEpochRequest) returns (UpdateGroupEpochResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}
