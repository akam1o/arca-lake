[package]
name = "arca-lake-metabench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Metadata hot-key micro-benchmark: concurrent cache insert / remove / touch against the in-memory store or FoundationDB"

[[bin]]
name = "metabench"
path = "src/main.rs"

[features]
fdb = ["arca-lake-metadata/fdb"]

[dependencies]
arca-lake-metadata.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
