# cargo-deny configuration. See ADR-0001 for the license policy.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each exception names one advisory, why it is taken and when it ends
# (docs/architecture/risks.md). Nothing else is relaxed: every other
# advisory, vulnerability or not, still fails the check.
ignore = [
    # chrono is unmaintained (an informational notice, not a vulnerability);
    # it comes only through s3s 0.17, no workspace crate uses it, and no s3s
    # release without it is stable yet. R-115: removed when a stable s3s no
    # longer pulls chrono (checked with `cargo tree -i chrono`), reconsidered
    # at once if a vulnerability is reported against chrono, re-checked at
    # the start of Phase 4.2.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, only via s3s 0.17; R-115" },
]

[licenses]
version = 2
# Permissive licenses compatible with distributing arca-lake under Apache-2.0.
# Adding anything else (in particular any copyleft license) requires an ADR.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    # Boost Software License 1.0 (not to be confused with the Business Source
    # License, BUSL-1.1): permissive, OSI approved. Used by xxhash-rust via s3s.
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace members reference each other by path without a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
