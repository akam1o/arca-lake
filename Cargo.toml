[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/protocol",
    "crates/ec",
    "crates/metadata",
    "crates/storage",
    "crates/storage-node",
    "crates/placement",
    "crates/tiering",
    "crates/controller",
    "crates/gateway",
    "crates/testkit",
    "crates/cli",
    "benchmarks/transfer",
    "benchmarks/s3load",
    "benchmarks/metabench",
    "benchmarks/soakload",
    "benchmarks/arcabench",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/akam1o/arca-lake"
rust-version = "1.99"

[workspace.dependencies]
# Internal crates.
arca-lake-common = { path = "crates/common" }
arca-lake-protocol = { path = "crates/protocol" }
arca-lake-ec = { path = "crates/ec" }
arca-lake-metadata = { path = "crates/metadata" }
arca-lake-storage = { path = "crates/storage" }
arca-lake-storage-node = { path = "crates/storage-node" }
arca-lake-placement = { path = "crates/placement" }
arca-lake-tiering = { path = "crates/tiering" }
arca-lake-controller = { path = "crates/controller" }
arca-lake-gateway = { path = "crates/gateway" }
arca-lake-testkit = { path = "crates/testkit" }

# External dependencies. Every crate takes its version from here.
thiserror = "2"
crc32c = "0.6"
md-5 = "0.11"
uuid = { version = "1", features = ["v4", "v7"] }
tempfile = "3"
foundationdb-tuple = "0.11"
foundationdb = { version = "0.11", default-features = false, features = ["fdb-7_3", "embedded-fdb-include"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
futures = "0.3"
s3s = "0.17"
# The path decoding of s3s (same crate and version), mirrored by the gateway.
urlencoding = "2"
http = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "std"] }
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", default-features = false }
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
http-body-util = "0.1"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
tonic = { version = "0.14", default-features = false }
tonic-prost = "0.14"
prost = "0.14"
tonic-prost-build = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
tokio-stream = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.14"
x509-parser = { version = "0.18", default-features = false }
time = { version = "0.3", default-features = false, features = ["std"] }
tower = { version = "0.5", default-features = false }
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
libc = "0.2"
# `std` is deliberately off: it pulls parking_lot 0.11 -> `instant`, which is
# flagged unmaintained by cargo-deny. The no_std build uses `spin` instead.
reed-solomon-erasure = { version = "6", default-features = false }
reed-solomon-simd = "3.1"
proptest = "1.12"
base64 = "0.22"
# Default features include the legacy hyper 0.14 / rustls 0.21 client,
# which carries open advisories; the hyper 1 client is enough for tests.
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "http-1x", "default-https-client", "rt-tokio", "sigv4a"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
# `deny` rather than `forbid` so that FFI wrappers can allow individual,
# documented `unsafe` blocks (see docs/architecture/repository-layout.md).
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Product names (FoundationDB, ETag, ...) in prose should not need backticks.
doc_markdown = "allow"

[profile.release]
debug = 1
lto = "thin"
