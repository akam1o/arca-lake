[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/protocol",
    "crates/ec",
    "crates/metadata",
    "crates/storage",
    "crates/storage-node",
    "crates/placement",
    "crates/tiering",
    "crates/controller",
    "crates/gateway",
    "crates/testkit",
    "crates/cli",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/akam1o/arca-lake"
rust-version = "1.99"

[workspace.dependencies]
# Internal crates.
arca-lake-common = { path = "crates/common" }
arca-lake-protocol = { path = "crates/protocol" }
arca-lake-ec = { path = "crates/ec" }
arca-lake-metadata = { path = "crates/metadata" }
arca-lake-storage = { path = "crates/storage" }
arca-lake-storage-node = { path = "crates/storage-node" }
arca-lake-placement = { path = "crates/placement" }
arca-lake-tiering = { path = "crates/tiering" }
arca-lake-controller = { path = "crates/controller" }
arca-lake-gateway = { path = "crates/gateway" }
arca-lake-testkit = { path = "crates/testkit" }

# External dependencies. Every crate takes its version from here.
thiserror = "2"
crc32c = "0.6"
uuid = { version = "1", features = ["v4", "v7"] }
tempfile = "3"
foundationdb-tuple = "0.11"
foundationdb = { version = "0.11", default-features = false, features = ["fdb-7_3", "embedded-fdb-include"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
futures = "0.3"
# `std` is deliberately off: it pulls parking_lot 0.11 -> `instant`, which is
# flagged unmaintained by cargo-deny. The no_std build uses `spin` instead.
reed-solomon-erasure = { version = "6", default-features = false }
reed-solomon-simd = "3.1"
proptest = "1.12"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
# `deny` rather than `forbid` so that FFI wrappers can allow individual,
# documented `unsafe` blocks (see docs/architecture/repository-layout.md).
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Product names (FoundationDB, ETag, ...) in prose should not need backticks.
doc_markdown = "allow"

[profile.release]
debug = 1
lto = "thin"
