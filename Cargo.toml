[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/protocol",
    "crates/ec",
    "crates/metadata",
    "crates/storage",
    "crates/storage-node",
    "crates/placement",
    "crates/tiering",
    "crates/controller",
    "crates/gateway",
    "crates/testkit",
    "crates/cli",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/akam1o/arca-lake"
rust-version = "1.99"

[workspace.dependencies]
# Internal crates.
arca-lake-common = { path = "crates/common" }
arca-lake-protocol = { path = "crates/protocol" }
arca-lake-ec = { path = "crates/ec" }
arca-lake-metadata = { path = "crates/metadata" }
arca-lake-storage = { path = "crates/storage" }
arca-lake-storage-node = { path = "crates/storage-node" }
arca-lake-placement = { path = "crates/placement" }
arca-lake-tiering = { path = "crates/tiering" }
arca-lake-controller = { path = "crates/controller" }
arca-lake-gateway = { path = "crates/gateway" }
arca-lake-testkit = { path = "crates/testkit" }

# External dependencies. Every crate takes its version from here.
thiserror = "2"
reed-solomon-erasure = { version = "6", default-features = false, features = ["std"] }
reed-solomon-simd = "3.1"
proptest = "1.12"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
debug = 1
lto = "thin"
