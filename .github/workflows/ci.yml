  # Four short checks in one job: their work takes seconds.
  checks:
    name: licenses, secrets, DCO, links
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"
      # cargo-deny refreshes the advisory database on every check, so the
      # cache only spares the initial clone; a key per run re-uploaded it
      # every time (about a minute).
      - name: cache cargo-deny and the advisory database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/arca-lake/cargo-deny
            ~/.cargo/advisory-dbs
          key: cargo-deny-${{ runner.os }}-0.20.2
      - name: install cargo-deny (pinned release)
        env:
          DENY_VERSION: 0.20.2
        run: |
          set -euo pipefail
          dir="$HOME/.cache/arca-lake/cargo-deny"; mkdir -p "$dir"
          if [ ! -x "$dir/cargo-deny" ]; then
            base="https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}"
            curl -sSL -o deny.tar.gz "${base}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            tar -xzf deny.tar.gz --strip-components=1 -C "$dir" "cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          fi
          echo "$dir" >> "$GITHUB_PATH"
      - run: cargo-deny check
      # The gitleaks GitHub Action fails on the first push of a branch
      # (empty "before" SHA), so run the pinned CLI directly and scan the
      # full history plus the working tree.
      - name: cache gitleaks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/arca-lake/gitleaks
          key: gitleaks-${{ runner.os }}-8.30.1
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          dir="$HOME/.cache/arca-lake/gitleaks"; mkdir -p "$dir"
          if [ ! -x "$dir/gitleaks" ]; then
            base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
            curl -sSL -o gitleaks.tar.gz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            curl -sSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
            grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt \
              | sed "s#gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz#gitleaks.tar.gz#" \
              | sha256sum -c -
            tar -xzf gitleaks.tar.gz -C "$dir" gitleaks
          fi
          echo "$dir" >> "$GITHUB_PATH"
      - name: scan git history
        run: gitleaks git --no-banner --redact --verbose --exit-code 1 .
      - name: scan working tree
        run: gitleaks dir --no-banner --redact --verbose --exit-code 1 .
      - name: scan measurement artifacts for environment identifiers
        run: python3 -I benchmarks/linux/sanitize.py --check benchmarks/linux/results benchmarks/reports docs
      - name: check Signed-off-by trailers
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            # Direct pushes to main: every commit of the push. A force push
            # or a new branch has no usable "before"; fall back to HEAD only.
            head="$PUSH_AFTER"
            if git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then base="$PUSH_BEFORE"; else base="$head~1"; fi
          fi
          # Merge commits are not contributions: GitHub writes them without a
          # sign-off (merge commits are disabled for pull requests; a rebase
          # or squash keeps each contributor's trailer).
          missing=0
          for c in $(git rev-list --no-merges "$base..$head"); do
            if ! git show -s --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "missing Signed-off-by: $c"
              missing=1
            fi
          done
          exit $missing
      - name: check markdown links (lychee, pinned image)
