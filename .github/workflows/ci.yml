name: CI

# GitHub-hosted runners only (the repository is public; no self-hosted
# runner is registered: docs/release/public-ci.md). Pull requests, forks
# included, run with a read-only token and no secrets; first-time
# contributors' runs wait for a maintainer's approval. The two upgrade
# jobs (a version-bumped build of this tree; several earlier releases,
# their binaries cached) run on pushes to main and on demand only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A later push cancels the run still in progress for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Test binaries at opt-level 1: the metadata multipart test that drives
  # 10 000 parts through the in-memory store is CPU-bound and ran for about
  # three minutes unoptimized.
  CARGO_PROFILE_TEST_OPT_LEVEL: "1"
  CARGO_INCREMENTAL: "0"
  # Line tables only: backtraces keep file and line, while compiling and
  # linking the test binaries (the longest part of every job) costs less,
  # and the cached dependencies are smaller.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  FDB_VERSION: 7.3.77

jobs:
  check:
    name: fmt, clippy, test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: prepare the runner (compiler, pkg-config; idempotent)
        run: |
          set -euo pipefail
          if ! command -v cc >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential pkg-config
          fi
          # S3 compatibility tests drive the gateway with the AWS CLI and
          # boto3 (they skip when the tools are absent; installed here).
          # boto3 is pinned in a virtual environment put first on PATH: the
          # distribution's python3-boto3 is too old to return the multipart
          # checksum type the conformance script checks. The distribution's
          # awscli package is unusable with Python 3.14 ("badly formed help
          # string"), so the official AWS CLI v2 bundle is installed instead,
          # pinned by version and SHA-256.
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q boto3==1.40.0
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
          if ! command -v unzip >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq unzip
          fi
          if ! aws --version 2>/dev/null | grep -q 'aws-cli/2.37.9 .*exe/x86_64'; then
            dpkg -s awscli >/dev/null 2>&1 && sudo apt-get remove -y -qq awscli
            tmp="$(mktemp -d)"
            curl -sSL --retry 5 -o "$tmp/awscli.zip" "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.37.9.zip"
            echo "6b3a6a3d7bb3997928f0bdf7b866914224abf242c2e54e1dcebbe84bee64f356  $tmp/awscli.zip" | sha256sum -c -
            (cd "$tmp" && unzip -q awscli.zip && sudo ./aws/install --update >/dev/null)
            rm -rf "$tmp"
          fi
          # bindgen (foundationdb-sys) needs libclang.
          if ! ls /usr/lib/llvm-*/lib/libclang*.so* >/dev/null 2>&1 && ! ls /usr/lib/x86_64-linux-gnu/libclang*.so* >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clang libclang-dev
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      # Each job starts on a fresh virtual machine: compiled dependencies
      # come from the Actions cache, saved again by every push to main
      # (pull requests only restore). The workspace's own crates are rebuilt
      # every time (a fresh checkout makes them stale) and are not saved.
      - name: restore cargo registry and compiled dependencies
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v2-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}-
            cargo-v2-${{ runner.os }}-${{ github.job }}-
      - run: echo "CARGO_TARGET_DIR=$PWD/target" >> "$GITHUB_ENV"
      # The `fdb` feature links libfdb_c; install the client library so that
      # --all-features builds and runs.
      - name: cache downloaded tools and packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/arca-lake
          key: tools-${{ runner.os }}-fdb7.3.77-v1
      - name: install FoundationDB client library
        env:
          FDB_VERSION: 7.3.77
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/arca-lake/fdb"
          deb="$HOME/.cache/arca-lake/fdb/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          [ -f "$deb" ] || curl -sSL -o "$deb" \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          dpkg -s foundationdb-clients 2>/dev/null | grep -q "Version: ${FDB_VERSION}" || sudo dpkg -i "$deb"
      # nextest runs the test binaries concurrently; `cargo test` runs them
      # one after another, so the slowest test gated the whole step.
      - name: install cargo-nextest (pinned release)
        env:
          NEXTEST_VERSION: 0.9.150
        run: |
          set -euo pipefail
          dir="$HOME/.cache/arca-lake/nextest"; mkdir -p "$dir"
          if [ ! -x "$dir/cargo-nextest" ]; then
            base="https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}"
            name="cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            curl -sSL -o nextest.tar.gz "${base}/${name}"
            curl -sSL -o nextest.sha256 "${base}/${name%.tar.gz}.sha256"
            sed "s#  ${name}\$#  nextest.tar.gz#" nextest.sha256 | sha256sum -c -
            tar -xzf nextest.tar.gz -C "$dir" cargo-nextest
            rm -f nextest.tar.gz nextest.sha256
          fi
          echo "$dir" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      # No doc tests: the workspace has none, and compiling the empty
      # doctest harness of every crate took one to two and a half minutes.
      # Test clusters initialise at schema 5 (6 with `version-bump`, which
      # `--all-features` includes): their storage nodes are strict
      # (ADR-0037).
      - name: test (all features)
        run: cargo nextest run --workspace --all-features --no-fail-fast
      # Strict shard write ownership end to end, named so that a change of
      # the step above cannot drop it silently (same features: no rebuild).
      - name: strict write ownership
        run: cargo nextest run --workspace --all-features --no-fail-fast -E 'test(/write_ownership/)'
      - run: cargo doc --workspace --no-deps --all-features
      - name: save compiled dependencies (pushes to main)
        if: success() && github.event_name == 'push'
        run: |
          # Keep dependencies only: the workspace's crates, test binaries and
          # documentation are rebuilt by every run.
          for d in target/debug target/doc; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 2 \( -name 'arca_lake*' -o -name 'arca-lake*' -o -name 'arcabench*' \) -prune -exec rm -rf {} + 2>/dev/null || true
            find "$d/deps" -maxdepth 1 -type f \( -name 'arca_lake*' -o -name 'arcabench*' -o -name 'it-*' \) -delete 2>/dev/null || true
          done
          rm -rf target/doc target/nextest target/tmp
          du -sh target 2>/dev/null || true
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: success() && github.event_name == 'push'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  fdb:
    name: FoundationDB backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FDB_VERSION: 7.3.77
      FDB_CONTAINER: fdb-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: prepare the runner (compiler, pkg-config; idempotent)
        run: |
          set -euo pipefail
          if ! command -v cc >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential pkg-config
          fi
          # S3 compatibility tests drive the gateway with the AWS CLI and
          # boto3 (they skip when the tools are absent; installed here).
          # boto3 is pinned in a virtual environment put first on PATH: the
          # distribution's python3-boto3 is too old to return the multipart
          # checksum type the conformance script checks. The distribution's
          # awscli package is unusable with Python 3.14 ("badly formed help
          # string"), so the official AWS CLI v2 bundle is installed instead,
          # pinned by version and SHA-256.
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q boto3==1.40.0
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
          if ! command -v unzip >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq unzip
          fi
          if ! aws --version 2>/dev/null | grep -q 'aws-cli/2.37.9 .*exe/x86_64'; then
            dpkg -s awscli >/dev/null 2>&1 && sudo apt-get remove -y -qq awscli
            tmp="$(mktemp -d)"
            curl -sSL --retry 5 -o "$tmp/awscli.zip" "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.37.9.zip"
            echo "6b3a6a3d7bb3997928f0bdf7b866914224abf242c2e54e1dcebbe84bee64f356  $tmp/awscli.zip" | sha256sum -c -
            (cd "$tmp" && unzip -q awscli.zip && sudo ./aws/install --update >/dev/null)
            rm -rf "$tmp"
          fi
          # bindgen (foundationdb-sys) needs libclang.
          if ! ls /usr/lib/llvm-*/lib/libclang*.so* >/dev/null 2>&1 && ! ls /usr/lib/x86_64-linux-gnu/libclang*.so* >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clang libclang-dev
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"
      # Each job starts on a fresh virtual machine: compiled dependencies
      # come from the Actions cache, saved again by every push to main
      # (pull requests only restore). The workspace's own crates are rebuilt
      # every time (a fresh checkout makes them stale) and are not saved.
      - name: restore cargo registry and compiled dependencies
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v2-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}-
            cargo-v2-${{ runner.os }}-${{ github.job }}-
      - run: echo "CARGO_TARGET_DIR=$PWD/target" >> "$GITHUB_ENV"
      - name: cache downloaded tools and packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/arca-lake
          key: tools-${{ runner.os }}-fdb7.3.77-v1
      - name: install FoundationDB client library
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/arca-lake/fdb"
          deb="$HOME/.cache/arca-lake/fdb/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          [ -f "$deb" ] || curl -sSL -o "$deb" \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          dpkg -s foundationdb-clients 2>/dev/null | grep -q "Version: ${FDB_VERSION}" || sudo dpkg -i "$deb"
      - name: start FoundationDB server
        run: |
          set -euo pipefail
          docker() { sudo docker "$@"; }
          docker rm -f -v "$FDB_CONTAINER" >/dev/null 2>&1 || true
          # Bridge network, with the server advertising its container
          # address (reachable from the runner host): no port shared with a
          # concurrent run on the same host. Same topology as the failover
          # job and deploy/dev/fdb-test.sh.
          docker run -d --name "$FDB_CONTAINER" -e FDB_NETWORKING_MODE=container \
            "foundationdb/foundationdb:${FDB_VERSION}"
          # The image starts fdbserver without a database, and `status` on
          # an unconfigured cluster prints nothing until fdbcli's timeout
          # (polling it this way cost 30 x 30 s per run). Create the database
          # right away and retry until the process answers.
          for _ in $(seq 1 30); do
            out="$(docker exec "$FDB_CONTAINER" fdbcli --timeout 10 --exec "configure new single memory" 2>&1 || true)"
            echo "$out"
            grep -qE "Database created|already exists" <<<"$out" && break
            sleep 1
          done
          for _ in $(seq 1 60); do
            docker exec "$FDB_CONTAINER" fdbcli --timeout 10 --exec "status minimal" 2>/dev/null | grep -q "is available" && break
            sleep 1
          done
          docker exec "$FDB_CONTAINER" fdbcli --timeout 30 --exec "status minimal"
          docker exec "$FDB_CONTAINER" cat /var/fdb/fdb.cluster | tee "$RUNNER_TEMP/fdb.cluster"
      - name: run tests
        env:
          ARCA_FDB_TESTS: "1"
          ARCA_FDB_CLUSTER_FILE: ${{ runner.temp }}/fdb.cluster
          # The tiering races and tiering_fdb:: clear the keyspace only of a
          # cluster confirmed disposable here.
          ARCA_FDB_CLEAR_OK: ${{ runner.temp }}/fdb.cluster
        run: |
          set -euo pipefail
          cargo test -p arca-lake-metadata --features fdb --test fdb -- --nocapture --test-threads=1
          cargo test -p arca-lake-metadata --features fdb --test tiering_race -- --nocapture --test-threads=1
          cargo test -p arca-lake-testkit --features fdb --test it -- --nocapture --test-threads=1 e2e_fdb:: faults_fdb:: cache_fdb:: cache_ec_fdb:: rebalance_fdb:: multipart_backpressure::multipart_under_backpressure_on_foundationdb system_model::random_operation_sequences_agree_with_the_model_on_foundationdb tiering_fdb::
      - name: metadata restore drill (fdbbackup/fdbrestore, RFC-015 §5.3.1)
        env:
          ARCA_FDB_TESTS: "1"
          ARCA_FDB_CLUSTER_FILE: ${{ runner.temp }}/fdb.cluster
          ARCA_FDB_BACKUP_URL: file:///var/fdb/backup
          ARCA_FDB_BACKUP_CLUSTER_FILE: /var/fdb/fdb.cluster
        run: |
          set -euo pipefail
          # The backup agent and the backup tools live in the server
          # container; the test drives them through `docker exec`.
          sudo docker exec "$FDB_CONTAINER" mkdir -p /var/fdb/backup
          sudo docker exec -d "$FDB_CONTAINER" backup_agent -C /var/fdb/fdb.cluster
          ARCA_FDB_BACKUP_CMD="sudo docker exec $FDB_CONTAINER" \
            cargo test -p arca-lake-testkit --features fdb --test it fdb_restore:: -- --nocapture --test-threads=1
      - name: save compiled dependencies (pushes to main)
        if: success() && github.event_name == 'push'
        run: |
          # Keep dependencies only: the workspace's crates, test binaries and
          # documentation are rebuilt by every run.
          for d in target/debug target/doc; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 2 \( -name 'arca_lake*' -o -name 'arca-lake*' -o -name 'arcabench*' \) -prune -exec rm -rf {} + 2>/dev/null || true
            find "$d/deps" -maxdepth 1 -type f \( -name 'arca_lake*' -o -name 'arcabench*' -o -name 'it-*' \) -delete 2>/dev/null || true
          done
          rm -rf target/doc target/nextest target/tmp
          du -sh target 2>/dev/null || true
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: success() && github.event_name == 'push'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: stop FoundationDB server
        if: always()
        run: sudo docker rm -f -v "$FDB_CONTAINER" >/dev/null 2>&1 || true

  # The mixed-version rolling upgrade: this tree and a version-bumped build
  # of it. Apart from the previous releases' job so that both run at once
  # (each on its own FoundationDB container): pushes to main and on-demand
  # runs only.
  fdb-mixed-version:
    name: FoundationDB mixed-version upgrade
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    timeout-minutes: 120
    env:
      FDB_VERSION: 7.3.77
      FDB_CONTAINER: fdb-mixed-${{ github.run_id }}
      # A failing test copies its processes' logs here; uploaded on failure.
      ARCA_TEST_ARTIFACTS: ${{ github.workspace }}/test-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Two builds of this tree fit the runner's disk (about 85 GB free):
      # no preinstalled SDK is removed.
      - name: free disk space before the builds
        run: df -h /
      - name: prepare the runner (compiler, pkg-config; idempotent)
        run: |
          set -euo pipefail
          if ! command -v cc >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential pkg-config
          fi
          # S3 compatibility tests drive the gateway with the AWS CLI and
          # boto3 (they skip when the tools are absent; installed here).
          # boto3 is pinned in a virtual environment put first on PATH: the
          # distribution's python3-boto3 is too old to return the multipart
          # checksum type the conformance script checks. The distribution's
          # awscli package is unusable with Python 3.14 ("badly formed help
          # string"), so the official AWS CLI v2 bundle is installed instead,
          # pinned by version and SHA-256.
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q boto3==1.40.0
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
          if ! command -v unzip >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq unzip
          fi
          if ! aws --version 2>/dev/null | grep -q 'aws-cli/2.37.9 .*exe/x86_64'; then
            dpkg -s awscli >/dev/null 2>&1 && sudo apt-get remove -y -qq awscli
            tmp="$(mktemp -d)"
            curl -sSL --retry 5 -o "$tmp/awscli.zip" "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.37.9.zip"
            echo "6b3a6a3d7bb3997928f0bdf7b866914224abf242c2e54e1dcebbe84bee64f356  $tmp/awscli.zip" | sha256sum -c -
            (cd "$tmp" && unzip -q awscli.zip && sudo ./aws/install --update >/dev/null)
            rm -rf "$tmp"
          fi
          # bindgen (foundationdb-sys) needs libclang.
          if ! ls /usr/lib/llvm-*/lib/libclang*.so* >/dev/null 2>&1 && ! ls /usr/lib/x86_64-linux-gnu/libclang*.so* >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clang libclang-dev
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"
      # Dependencies only: the builds' output would take the repository's
      # whole cache quota and evict the other jobs' entries.
      - name: cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: echo "CARGO_TARGET_DIR=$PWD/target" >> "$GITHUB_ENV"
      - name: cache downloaded tools and packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/arca-lake
          key: tools-${{ runner.os }}-fdb7.3.77-v1
      - name: install FoundationDB client library
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/arca-lake/fdb"
          deb="$HOME/.cache/arca-lake/fdb/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          [ -f "$deb" ] || curl -sSL -o "$deb" \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          dpkg -s foundationdb-clients 2>/dev/null | grep -q "Version: ${FDB_VERSION}" || sudo dpkg -i "$deb"
      - name: start FoundationDB server
        run: |
          set -euo pipefail
          docker() { sudo docker "$@"; }
          docker rm -f -v "$FDB_CONTAINER" >/dev/null 2>&1 || true
          # Bridge network, with the server advertising its container
          # address (reachable from the runner host): no port shared with a
          # concurrent run on the same host. Same topology as the failover
          # job and deploy/dev/fdb-test.sh.
          docker run -d --name "$FDB_CONTAINER" -e FDB_NETWORKING_MODE=container \
            "foundationdb/foundationdb:${FDB_VERSION}"
          # The image starts fdbserver without a database, and `status` on
          # an unconfigured cluster prints nothing until fdbcli's timeout
          # (polling it this way cost 30 x 30 s per run). Create the database
          # right away and retry until the process answers.
          for _ in $(seq 1 30); do
            out="$(docker exec "$FDB_CONTAINER" fdbcli --timeout 10 --exec "configure new single memory" 2>&1 || true)"
            echo "$out"
            grep -qE "Database created|already exists" <<<"$out" && break
            sleep 1
          done
          for _ in $(seq 1 60); do
            docker exec "$FDB_CONTAINER" fdbcli --timeout 10 --exec "status minimal" 2>/dev/null | grep -q "is available" && break
            sleep 1
          done
          docker exec "$FDB_CONTAINER" fdbcli --timeout 30 --exec "status minimal"
          docker exec "$FDB_CONTAINER" cat /var/fdb/fdb.cluster | tee "$RUNNER_TEMP/fdb.cluster"
      - name: mixed-version rolling upgrade (two binaries, RFC-014 §5.7)
        env:
          ARCA_FDB_TESTS: "1"
          ARCA_FDB_CLUSTER_FILE: ${{ runner.temp }}/fdb.cluster
        run: |
          set -euo pipefail
          # The "old" build is this tree; the "new" one the same tree with the
          # test-only version bump (a different binary, ADR-0016).
          cargo build -p arca-lake --features fdb
          cargo build -p arca-lake --features fdb,version-bump --target-dir "$CARGO_TARGET_DIR/bump"
          ARCA_BIN_OLD="$CARGO_TARGET_DIR/debug/arca-lake" \
          ARCA_BIN_NEW="$CARGO_TARGET_DIR/bump/debug/arca-lake" \
            cargo test -p arca-lake-testkit --features fdb --test it mixed_version:: -- --nocapture --test-threads=1
      - name: free disk space after the builds
        if: always()
        run: df -h /
      - name: keep FoundationDB state (on failure)
