          fdbcli "status minimal" | tee /tmp/status.txt
          grep -q "is available" /tmp/status.txt || { echo "cluster not available"; fdbcli "status details" || true; docker logs arca-fdb; exit 1; }
          # "available" is not "healthy": right after start some processes
          # still report errors and transactions time out (flaky run seen on
          # 2026-11-02). Wait for healthy data with no process messages.
          for i in $(seq 1 30); do
            if fdbcli "status json" 2>/dev/null | python3 -c '
          import json,sys
          s=json.load(sys.stdin)["cluster"]
          ok = s.get("data",{}).get("state",{}).get("healthy", False) and all(not p.get("messages") for p in s.get("processes",{}).values())
          sys.exit(0 if ok else 1)'; then echo "cluster healthy after $i checks"; break; fi
            sleep 2
          done
          fdbcli "status details" | head -40
          docker exec arca-fdb cat /var/fdb/fdb.cluster > /tmp/fdb.cluster
          cat /tmp/fdb.cluster
      - name: put a sudo docker wrapper on PATH for the test's chaos actions
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/usr/bin/env bash\nexec sudo /usr/bin/docker "$@"\n' > "$HOME/.local/bin/docker"
          chmod +x "$HOME/.local/bin/docker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: member moves under FoundationDB process and quorum loss (Phase 3.4 §4)
        env:
          ARCA_FDB_TESTS: "1"
          ARCA_CHAOS_DOCKER: "1"
          ARCA_FDB_CLUSTER_FILE: /tmp/fdb.cluster
        run: "cargo test -p arca-lake-testkit --features fdb --test it membership_faults::fdb:: -- --nocapture --test-threads=1"
      - name: run the failover test
        env:
          ARCA_FDB_TESTS: "1"
          ARCA_FDB_FAILOVER: "1"
          ARCA_CHAOS_DOCKER: "1"
          ARCA_FDB_CLUSTER_FILE: /tmp/fdb.cluster
        run: "cargo test -p arca-lake-testkit --features fdb --test it fdb_failover:: -- --nocapture --test-threads=1"
      - name: save compiled dependencies (pushes to main)
        if: success() && github.event_name == 'push'
        run: |
          # Keep dependencies only: the workspace's crates, test binaries and
          # documentation are rebuilt by every run.
          for d in target/debug target/doc; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 2 \( -name 'arca_lake*' -o -name 'arca-lake*' -o -name 'arcabench*' \) -prune -exec rm -rf {} + 2>/dev/null || true
            find "$d/deps" -maxdepth 1 -type f \( -name 'arca_lake*' -o -name 'arcabench*' -o -name 'it-*' \) -delete 2>/dev/null || true
          done
          rm -rf target/doc target/nextest target/tmp
          du -sh target 2>/dev/null || true
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: success() && github.event_name == 'push'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: stop the cluster
        if: always()
        run: sudo docker rm -f -v arca-fdb >/dev/null 2>&1 || true

  # Four short checks in one job: their work takes seconds.
  checks:
    name: licenses, secrets, DCO, links
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"
      # cargo-deny refreshes the advisory database on every check, so the
      # cache only spares the initial clone; a key per run re-uploaded it
      # every time (about a minute).
      - name: cache cargo-deny and the advisory database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/arca-lake/cargo-deny
            ~/.cargo/advisory-dbs
          key: cargo-deny-${{ runner.os }}-0.20.2
      - name: install cargo-deny (pinned release)
        env:
          DENY_VERSION: 0.20.2
        run: |
          set -euo pipefail
          dir="$HOME/.cache/arca-lake/cargo-deny"; mkdir -p "$dir"
          if [ ! -x "$dir/cargo-deny" ]; then
            base="https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}"
            curl -sSL -o deny.tar.gz "${base}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            tar -xzf deny.tar.gz --strip-components=1 -C "$dir" "cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          fi
          echo "$dir" >> "$GITHUB_PATH"
      - run: cargo-deny check
      # The gitleaks GitHub Action fails on the first push of a branch
      # (empty "before" SHA), so run the pinned CLI directly and scan the
      # full history plus the working tree.
      - name: cache gitleaks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/arca-lake/gitleaks
          key: gitleaks-${{ runner.os }}-8.30.1
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          dir="$HOME/.cache/arca-lake/gitleaks"; mkdir -p "$dir"
          if [ ! -x "$dir/gitleaks" ]; then
            base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
            curl -sSL -o gitleaks.tar.gz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            curl -sSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
            grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt \
              | sed "s#gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz#gitleaks.tar.gz#" \
              | sha256sum -c -
            tar -xzf gitleaks.tar.gz -C "$dir" gitleaks
          fi
          echo "$dir" >> "$GITHUB_PATH"
      - name: scan git history
        run: gitleaks git --no-banner --redact --verbose --exit-code 1 .
      - name: scan working tree
        run: gitleaks dir --no-banner --redact --verbose --exit-code 1 .
      - name: scan measurement artifacts for environment identifiers
        run: python3 -I benchmarks/linux/sanitize.py --check benchmarks/linux/results benchmarks/reports docs
      - name: R-110 retest tooling tests (local only, no host)
        working-directory: benchmarks/linux
        run: python3 -I -W ignore::ResourceWarning -m unittest discover -s r110/tests -t . -v
      - name: hot-key A/B driver tests (local only, no host)
        run: python3 -I benchmarks/linux/hot_key_ab_test.py -v
      - name: check Signed-off-by trailers
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            # Direct pushes to main: every commit of the push. A force push
            # or a new branch has no usable "before"; fall back to HEAD only.
            head="$PUSH_AFTER"
            if git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then base="$PUSH_BEFORE"; else base="$head~1"; fi
          fi
          # Merge commits are not contributions: GitHub writes them without a
          # sign-off (merge commits are disabled for pull requests; a rebase
          # or squash keeps each contributor's trailer).
          missing=0
          for c in $(git rev-list --no-merges "$base..$head"); do
            if ! git show -s --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "missing Signed-off-by: $c"
              missing=1
            fi
          done
          exit $missing
      - name: check markdown links (lychee, pinned image)
        run: |
          set -euo pipefail
          sudo docker run --rm -v "$PWD:/input:ro" -w /input lycheeverse/lychee@sha256:eaff3e0a13603c9a701accfcc84f44158bb77bf36ecfa4622b626056c3463892 \
            --no-progress --offline './**/*.md'
