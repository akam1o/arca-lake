name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Self-hosted Linux runners execute every job of this workflow; a later
# push cancels the run still in progress for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test (Linux)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: prepare the runner (compiler, pkg-config; idempotent)
        run: |
          set -euo pipefail
          if ! command -v cc >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential pkg-config
          fi
          # bindgen (foundationdb-sys) needs libclang.
          if ! ls /usr/lib/llvm-*/lib/libclang*.so* >/dev/null 2>&1 && ! ls /usr/lib/x86_64-linux-gnu/libclang*.so* >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clang libclang-dev
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The `fdb` feature links libfdb_c; install the client library on Linux
      # so that --all-features builds and runs. macOS tests skip that feature.
      - name: install FoundationDB client library
        env:
          FDB_VERSION: 7.3.77
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/fdb-clients.deb \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          sudo apt-get install -y /tmp/fdb-clients.deb
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - name: test (all features)
        run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps --all-features

  fdb:
    name: FoundationDB backend tests
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    env:
      FDB_VERSION: 7.3.77
    steps:
      - uses: actions/checkout@v4
      - name: prepare the runner (compiler, pkg-config; idempotent)
        run: |
          set -euo pipefail
          if ! command -v cc >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential pkg-config
          fi
          # bindgen (foundationdb-sys) needs libclang.
          if ! ls /usr/lib/llvm-*/lib/libclang*.so* >/dev/null 2>&1 && ! ls /usr/lib/x86_64-linux-gnu/libclang*.so* >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clang libclang-dev
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - name: install FoundationDB client library
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/fdb-clients.deb \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          sudo apt-get install -y /tmp/fdb-clients.deb
      - name: start FoundationDB server
        run: |
          set -euo pipefail
          docker() { sudo docker "$@"; }
          docker rm -f fdb >/dev/null 2>&1 || true
          docker run -d --name fdb --network host -e FDB_NETWORKING_MODE=host \
            "foundationdb/foundationdb:${FDB_VERSION}"
          for _ in $(seq 1 30); do
            docker exec fdb fdbcli --timeout 30 --exec "status minimal" 2>/dev/null | grep -q "available" && break
            sleep 1
          done
          docker exec fdb fdbcli --timeout 30 --exec "configure new single memory" || true
          for _ in $(seq 1 60); do
            docker exec fdb fdbcli --timeout 30 --exec "status minimal" 2>/dev/null | grep -q "is available" && break
            sleep 1
          done
          docker exec fdb fdbcli --timeout 30 --exec "status minimal"
          docker exec fdb cat /var/fdb/fdb.cluster > /tmp/fdb.cluster
      - name: run tests
        env:
          ARCA_FDB_TESTS: "1"
          ARCA_FDB_CLUSTER_FILE: /tmp/fdb.cluster
        run: |
          set -euo pipefail
          cargo test -p arca-lake-metadata --features fdb --test fdb -- --nocapture --test-threads=1
          cargo test -p arca-lake-testkit --features fdb --test e2e_fdb --test faults_fdb --test cache_fdb --test cache_ec_fdb -- --nocapture --test-threads=1
      - name: stop FoundationDB server
        if: always()
        run: sudo docker rm -f fdb >/dev/null 2>&1 || true

  fdb-failover:
    name: FoundationDB failover (3 processes)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      FDB_VERSION: 7.3.77
    steps:
      - uses: actions/checkout@v4
      - name: prepare the runner (compiler, pkg-config; idempotent)
        run: |
          set -euo pipefail
          if ! command -v cc >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential pkg-config
          fi
          # bindgen (foundationdb-sys) needs libclang.
          if ! ls /usr/lib/llvm-*/lib/libclang*.so* >/dev/null 2>&1 && ! ls /usr/lib/x86_64-linux-gnu/libclang*.so* >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clang libclang-dev
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - name: install FoundationDB client library
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/fdb-clients.deb \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          sudo apt-get install -y /tmp/fdb-clients.deb
      - name: start a three-process FoundationDB cluster (bridge network)
        run: |
          set -euo pipefail
          docker() { sudo docker "$@"; }
          # Bridge network: the processes advertise the container's address,
          # which the runner host can reach directly (same topology as the
          # local script, where fdbcli and the test container reach it).
          docker rm -f arca-fdb >/dev/null 2>&1 || true
          docker run -d --name arca-fdb \
            -v "$PWD/deploy/dev/fdb-multi-entrypoint.sh:/entry.sh:ro" \
            --entrypoint bash "foundationdb/foundationdb:${FDB_VERSION}" /entry.sh
          sleep 8
          docker logs arca-fdb
          for i in 1 2 3; do
            echo "--- process $i: $(docker exec arca-fdb fdbproc status $i)"
            docker exec arca-fdb cat /var/fdb/logs/proc-$i.out || true
          done
          IP="$(docker exec arca-fdb hostname -i | awk '{print $1}')"
          echo "fdb address: $IP"
          fdbcli() { timeout 60 sudo docker exec arca-fdb fdbcli --timeout 20 --exec "$1"; }
          fdbcli "configure new double memory" || true
          sleep 3
          fdbcli "coordinators ${IP}:4500 ${IP}:4501 ${IP}:4502" || true
          for _ in $(seq 1 20); do
            fdbcli "status minimal" 2>/dev/null | grep -q "is available" && break
            sleep 3
          done
          fdbcli "status minimal" | tee /tmp/status.txt
          grep -q "is available" /tmp/status.txt || { echo "cluster not available"; fdbcli "status details" || true; docker logs arca-fdb; exit 1; }
          fdbcli "status details" | head -40
          docker exec arca-fdb cat /var/fdb/fdb.cluster > /tmp/fdb.cluster
          cat /tmp/fdb.cluster
      - name: put a sudo docker wrapper on PATH for the test's chaos actions
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/usr/bin/env bash\nexec sudo /usr/bin/docker "$@"\n' > "$HOME/.local/bin/docker"
          chmod +x "$HOME/.local/bin/docker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: run the failover test
        env:
          ARCA_FDB_TESTS: "1"
          ARCA_FDB_FAILOVER: "1"
          ARCA_CHAOS_DOCKER: "1"
          ARCA_FDB_CLUSTER_FILE: /tmp/fdb.cluster
        run: cargo test -p arca-lake-testkit --features fdb --test fdb_failover -- --nocapture --test-threads=1
      - name: stop the cluster
        if: always()
        run: sudo docker rm -f arca-fdb >/dev/null 2>&1 || true

  deny:
    name: licenses and advisories
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - name: install cargo-deny (pinned release)
        env:
          DENY_VERSION: 0.18.5
        run: |
          set -euo pipefail
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}"
          curl -sSL -o deny.tar.gz "${base}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p "$HOME/.local/bin"
          tar -xzf deny.tar.gz --strip-components=1 -C "$HOME/.local/bin" "cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cargo-deny check

  secrets:
    name: secret scan
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action fails on the first push of a branch
      # (empty "before" SHA), so run the pinned CLI directly and scan the
      # full history plus the working tree.
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSL -o gitleaks.tar.gz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt \
            | sed "s#gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz#gitleaks.tar.gz#" \
            | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: scan git history
        run: gitleaks git --no-banner --redact --verbose --exit-code 1 .
      - name: scan working tree
        run: gitleaks dir --no-banner --redact --verbose --exit-code 1 .
      - name: scan measurement artifacts for environment identifiers
        run: python3 -I benchmarks/linux/sanitize.py --check benchmarks/linux/results benchmarks/reports docs

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check Signed-off-by trailers
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for c in $(git rev-list "$base..$head"); do
            if ! git show -s --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "missing Signed-off-by: $c"
              missing=1
            fi
          done
          exit $missing

  docs:
    name: markdown links
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: check markdown links (lychee, pinned image)
        run: |
          set -euo pipefail
          sudo docker run --rm -v "$PWD:/input:ro" -w /input lycheeverse/lychee:latest \
            --no-progress --offline './**/*.md'
