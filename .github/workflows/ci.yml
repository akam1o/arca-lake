      - name: upload diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdb-mixed-version-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-artifacts
          retention-days: 14
