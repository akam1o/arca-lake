name: CI

# Push to main only (RFC-012 §5.11): every job runs on self-hosted
# runners, so pull requests (and above all pull requests from forks) never
# trigger this workflow; each job also refuses any other event.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Self-hosted Linux runners execute every job of this workflow; a later
# push cancels the run still in progress for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Test binaries at opt-level 1: the metadata multipart test that drives
  # 10 000 parts through the in-memory store is CPU-bound and ran for about
  # three minutes unoptimized. The persistent target directory absorbs the
  # one-time cost of the slower compile.
  CARGO_PROFILE_TEST_OPT_LEVEL: "1"

jobs:
  check:
    name: fmt, clippy, test (Linux)
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: prepare the runner (compiler, pkg-config; idempotent)
        run: |
          set -euo pipefail
          if ! command -v cc >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential pkg-config
          fi
          # S3 compatibility tests drive the gateway with the AWS CLI and
          # boto3 (they skip when the tools are absent; the runner has them).
          # The distribution's awscli package is unusable with Python 3.14
          # ("badly formed help string"), so the official AWS CLI v2 bundle
          # is installed instead, pinned by version and SHA-256.
          if ! python3 -c 'import boto3' 2>/dev/null || ! command -v unzip >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-boto3 unzip
          fi
          if ! aws --version 2>/dev/null | grep -q 'aws-cli/2.37.9 .*exe/x86_64'; then
            dpkg -s awscli >/dev/null 2>&1 && sudo apt-get remove -y -qq awscli
            tmp="$(mktemp -d)"
            curl -sSL --retry 5 -o "$tmp/awscli.zip" "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.37.9.zip"
            echo "6b3a6a3d7bb3997928f0bdf7b866914224abf242c2e54e1dcebbe84bee64f356  $tmp/awscli.zip" | sha256sum -c -
            (cd "$tmp" && unzip -q awscli.zip && sudo ./aws/install --update >/dev/null)
            rm -rf "$tmp"
          fi
          # bindgen (foundationdb-sys) needs libclang.
          if ! ls /usr/lib/llvm-*/lib/libclang*.so* >/dev/null 2>&1 && ! ls /usr/lib/x86_64-linux-gnu/libclang*.so* >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clang libclang-dev
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      # The runner is persistent, but actions/checkout cleans the workspace
      # (`git clean -ffdx` removes target/). Build outside it so that the
      # artifacts survive between runs; restoring them from the GitHub cache
      # instead took longer than the build itself (777 MB at ~3 MB/s per job).
      # Kept outside ~/.cache/arca-lake, which the tools cache step archives.
      - name: build in a target directory that outlives the checkout
        run: |
          dir="$HOME/.cache/arca-lake-target"
          # Start over once the directory has grown past 20 GB.
          if [ -d "$dir" ] && [ "$(du -sm "$dir" | cut -f1)" -gt 20480 ]; then rm -rf "$dir"; fi
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      # The `fdb` feature links libfdb_c; install the client library so that
      # --all-features builds and runs.
      - name: cache downloaded tools and packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/arca-lake
          key: tools-${{ runner.os }}-fdb7.3.77-v1
      - name: install FoundationDB client library
        env:
          FDB_VERSION: 7.3.77
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/arca-lake/fdb"
          deb="$HOME/.cache/arca-lake/fdb/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          [ -f "$deb" ] || curl -sSL -o "$deb" \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          dpkg -s foundationdb-clients 2>/dev/null | grep -q "Version: ${FDB_VERSION}" || sudo apt-get install -y "$deb"
      # nextest runs the test binaries concurrently; `cargo test` runs them
      # one after another, so the slowest test gated the whole step.
      - name: install cargo-nextest (pinned release)
        env:
          NEXTEST_VERSION: 0.9.150
        run: |
          set -euo pipefail
          dir="$HOME/.cache/arca-lake/nextest"; mkdir -p "$dir"
          if [ ! -x "$dir/cargo-nextest" ]; then
            base="https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}"
            name="cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            curl -sSL -o nextest.tar.gz "${base}/${name}"
            curl -sSL -o nextest.sha256 "${base}/${name%.tar.gz}.sha256"
            sed "s#  ${name}\$#  nextest.tar.gz#" nextest.sha256 | sha256sum -c -
            tar -xzf nextest.tar.gz -C "$dir" cargo-nextest
            rm -f nextest.tar.gz nextest.sha256
          fi
          echo "$dir" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - name: test (all features)
        run: |
          set -euo pipefail
          cargo nextest run --workspace --all-features --no-fail-fast
          cargo test --workspace --all-features --doc
      - run: cargo doc --workspace --no-deps --all-features

  fdb:
    name: FoundationDB backend tests
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    env:
      FDB_VERSION: 7.3.77
      # Per-run container name: two runners share the host.
      FDB_CONTAINER: fdb-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: prepare the runner (compiler, pkg-config; idempotent)
        run: |
          set -euo pipefail
          if ! command -v cc >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential pkg-config
          fi
          # S3 compatibility tests drive the gateway with the AWS CLI and
          # boto3 (they skip when the tools are absent; the runner has them).
          # The distribution's awscli package is unusable with Python 3.14
          # ("badly formed help string"), so the official AWS CLI v2 bundle
          # is installed instead, pinned by version and SHA-256.
          if ! python3 -c 'import boto3' 2>/dev/null || ! command -v unzip >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-boto3 unzip
          fi
          if ! aws --version 2>/dev/null | grep -q 'aws-cli/2.37.9 .*exe/x86_64'; then
            dpkg -s awscli >/dev/null 2>&1 && sudo apt-get remove -y -qq awscli
            tmp="$(mktemp -d)"
            curl -sSL --retry 5 -o "$tmp/awscli.zip" "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.37.9.zip"
            echo "6b3a6a3d7bb3997928f0bdf7b866914224abf242c2e54e1dcebbe84bee64f356  $tmp/awscli.zip" | sha256sum -c -
            (cd "$tmp" && unzip -q awscli.zip && sudo ./aws/install --update >/dev/null)
            rm -rf "$tmp"
          fi
          # bindgen (foundationdb-sys) needs libclang.
          if ! ls /usr/lib/llvm-*/lib/libclang*.so* >/dev/null 2>&1 && ! ls /usr/lib/x86_64-linux-gnu/libclang*.so* >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clang libclang-dev
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"
      # The runner is persistent, but actions/checkout cleans the workspace
      # (`git clean -ffdx` removes target/). Build outside it so that the
      # artifacts survive between runs; restoring them from the GitHub cache
      # instead took longer than the build itself (777 MB at ~3 MB/s per job).
      # Kept outside ~/.cache/arca-lake, which the tools cache step archives.
      - name: build in a target directory that outlives the checkout
        run: |
          dir="$HOME/.cache/arca-lake-target"
          # Start over once the directory has grown past 20 GB.
          if [ -d "$dir" ] && [ "$(du -sm "$dir" | cut -f1)" -gt 20480 ]; then rm -rf "$dir"; fi
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - name: cache downloaded tools and packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/arca-lake
          key: tools-${{ runner.os }}-fdb7.3.77-v1
      - name: install FoundationDB client library
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/arca-lake/fdb"
          deb="$HOME/.cache/arca-lake/fdb/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          [ -f "$deb" ] || curl -sSL -o "$deb" \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          dpkg -s foundationdb-clients 2>/dev/null | grep -q "Version: ${FDB_VERSION}" || sudo apt-get install -y "$deb"
      - name: start FoundationDB server
        run: |
          set -euo pipefail
          docker() { sudo docker "$@"; }
          docker rm -f "$FDB_CONTAINER" >/dev/null 2>&1 || true
          # Bridge network, with the server advertising its container
          # address (reachable from the runner host): no port shared with a
          # concurrent run on the same host. Same topology as the failover
          # job and deploy/dev/fdb-test.sh.
          docker run -d --name "$FDB_CONTAINER" -e FDB_NETWORKING_MODE=container \
            "foundationdb/foundationdb:${FDB_VERSION}"
          # The image starts fdbserver without a database, and `status` on
          # an unconfigured cluster prints nothing until fdbcli's timeout
          # (polling it this way cost 30 x 30 s per run). Create the database
          # right away and retry until the process answers.
          for _ in $(seq 1 30); do
            out="$(docker exec "$FDB_CONTAINER" fdbcli --timeout 10 --exec "configure new single memory" 2>&1 || true)"
            echo "$out"
            grep -qE "Database created|already exists" <<<"$out" && break
            sleep 1
          done
          for _ in $(seq 1 60); do
            docker exec "$FDB_CONTAINER" fdbcli --timeout 10 --exec "status minimal" 2>/dev/null | grep -q "is available" && break
            sleep 1
          done
          docker exec "$FDB_CONTAINER" fdbcli --timeout 30 --exec "status minimal"
          docker exec "$FDB_CONTAINER" cat /var/fdb/fdb.cluster | tee "$RUNNER_TEMP/fdb.cluster"
      - name: run tests
        env:
          ARCA_FDB_TESTS: "1"
          ARCA_FDB_CLUSTER_FILE: ${{ runner.temp }}/fdb.cluster
        run: |
          set -euo pipefail
          cargo test -p arca-lake-metadata --features fdb --test fdb -- --nocapture --test-threads=1
          cargo test -p arca-lake-testkit --features fdb --test e2e_fdb --test faults_fdb --test cache_fdb --test cache_ec_fdb -- --nocapture --test-threads=1
      - name: mixed-version rolling upgrade (two binaries, RFC-014 §5.7)
        env:
          ARCA_FDB_TESTS: "1"
          ARCA_FDB_CLUSTER_FILE: ${{ runner.temp }}/fdb.cluster
        run: |
          set -euo pipefail
          # The "old" build is this tree; the "new" one the same tree with the
          # test-only version bump (a different binary, ADR-0016).
          cargo build -p arca-lake --features fdb
          cargo build -p arca-lake --features fdb,version-bump --target-dir "$CARGO_TARGET_DIR/bump"
          ARCA_BIN_OLD="$CARGO_TARGET_DIR/debug/arca-lake" \
          ARCA_BIN_NEW="$CARGO_TARGET_DIR/bump/debug/arca-lake" \
            cargo test -p arca-lake-testkit --features fdb --test mixed_version -- --nocapture --test-threads=1
      - name: metadata restore drill (fdbbackup/fdbrestore, RFC-015 §5.3.1)
        env:
          ARCA_FDB_TESTS: "1"
          ARCA_FDB_CLUSTER_FILE: ${{ runner.temp }}/fdb.cluster
          ARCA_FDB_BACKUP_URL: file:///var/fdb/backup
          ARCA_FDB_BACKUP_CLUSTER_FILE: /var/fdb/fdb.cluster
        run: |
          set -euo pipefail
          # The backup agent and the backup tools live in the server
          # container; the test drives them through `docker exec`.
          sudo docker exec "$FDB_CONTAINER" mkdir -p /var/fdb/backup
          sudo docker exec -d "$FDB_CONTAINER" backup_agent -C /var/fdb/fdb.cluster
          ARCA_FDB_BACKUP_CMD="sudo docker exec $FDB_CONTAINER" \
            cargo test -p arca-lake-testkit --features fdb --test fdb_restore -- --nocapture --test-threads=1
      - name: stop FoundationDB server
        if: always()
        run: sudo docker rm -f "$FDB_CONTAINER" >/dev/null 2>&1 || true

  fdb-failover:
    name: FoundationDB failover (3 processes)
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    # The failover test addresses the container as `arca-fdb` by name, so
    # two of these jobs cannot share a host: a later run waits for this one.
    concurrency:
      group: fdb-failover-host
    env:
      FDB_VERSION: 7.3.77
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: prepare the runner (compiler, pkg-config; idempotent)
        run: |
          set -euo pipefail
          if ! command -v cc >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential pkg-config
          fi
          # S3 compatibility tests drive the gateway with the AWS CLI and
          # boto3 (they skip when the tools are absent; the runner has them).
          # The distribution's awscli package is unusable with Python 3.14
          # ("badly formed help string"), so the official AWS CLI v2 bundle
          # is installed instead, pinned by version and SHA-256.
          if ! python3 -c 'import boto3' 2>/dev/null || ! command -v unzip >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-boto3 unzip
          fi
          if ! aws --version 2>/dev/null | grep -q 'aws-cli/2.37.9 .*exe/x86_64'; then
            dpkg -s awscli >/dev/null 2>&1 && sudo apt-get remove -y -qq awscli
            tmp="$(mktemp -d)"
            curl -sSL --retry 5 -o "$tmp/awscli.zip" "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.37.9.zip"
            echo "6b3a6a3d7bb3997928f0bdf7b866914224abf242c2e54e1dcebbe84bee64f356  $tmp/awscli.zip" | sha256sum -c -
            (cd "$tmp" && unzip -q awscli.zip && sudo ./aws/install --update >/dev/null)
            rm -rf "$tmp"
          fi
          # bindgen (foundationdb-sys) needs libclang.
          if ! ls /usr/lib/llvm-*/lib/libclang*.so* >/dev/null 2>&1 && ! ls /usr/lib/x86_64-linux-gnu/libclang*.so* >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clang libclang-dev
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"
      # The runner is persistent, but actions/checkout cleans the workspace
      # (`git clean -ffdx` removes target/). Build outside it so that the
      # artifacts survive between runs; restoring them from the GitHub cache
      # instead took longer than the build itself (777 MB at ~3 MB/s per job).
      # Kept outside ~/.cache/arca-lake, which the tools cache step archives.
      - name: build in a target directory that outlives the checkout
        run: |
          dir="$HOME/.cache/arca-lake-target"
          # Start over once the directory has grown past 20 GB.
          if [ -d "$dir" ] && [ "$(du -sm "$dir" | cut -f1)" -gt 20480 ]; then rm -rf "$dir"; fi
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - name: cache downloaded tools and packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/arca-lake
          key: tools-${{ runner.os }}-fdb7.3.77-v1
      - name: install FoundationDB client library
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/arca-lake/fdb"
          deb="$HOME/.cache/arca-lake/fdb/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          [ -f "$deb" ] || curl -sSL -o "$deb" \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          dpkg -s foundationdb-clients 2>/dev/null | grep -q "Version: ${FDB_VERSION}" || sudo apt-get install -y "$deb"
      - name: start a three-process FoundationDB cluster (bridge network)
        run: |
          set -euo pipefail
          docker() { sudo docker "$@"; }
          # Bridge network: the processes advertise the container's address,
          # which the runner host can reach directly (same topology as the
          # local script, where fdbcli and the test container reach it).
          docker rm -f arca-fdb >/dev/null 2>&1 || true
          docker run -d --name arca-fdb \
            -v "$PWD/deploy/dev/fdb-multi-entrypoint.sh:/entry.sh:ro" \
            --entrypoint bash "foundationdb/foundationdb:${FDB_VERSION}" /entry.sh
          sleep 8
          docker logs arca-fdb
          for i in 1 2 3; do
            echo "--- process $i: $(docker exec arca-fdb fdbproc status $i)"
            docker exec arca-fdb cat /var/fdb/logs/proc-$i.out || true
          done
          IP="$(docker exec arca-fdb hostname -i | awk '{print $1}')"
          echo "fdb address: $IP"
          fdbcli() { timeout 60 sudo docker exec arca-fdb fdbcli --timeout 20 --exec "$1"; }
          fdbcli "configure new double memory" || true
          sleep 3
          fdbcli "coordinators ${IP}:4500 ${IP}:4501 ${IP}:4502" || true
          for _ in $(seq 1 20); do
            fdbcli "status minimal" 2>/dev/null | grep -q "is available" && break
            sleep 3
          done
          fdbcli "status minimal" | tee /tmp/status.txt
          grep -q "is available" /tmp/status.txt || { echo "cluster not available"; fdbcli "status details" || true; docker logs arca-fdb; exit 1; }
          # "available" is not "healthy": right after start some processes
          # still report errors and transactions time out (flaky run seen on
          # 2026-11-02). Wait for healthy data with no process messages.
          for i in $(seq 1 30); do
            if fdbcli "status json" 2>/dev/null | python3 -c '
          import json,sys
          s=json.load(sys.stdin)["cluster"]
          ok = s.get("data",{}).get("state",{}).get("healthy", False) and all(not p.get("messages") for p in s.get("processes",{}).values())
          sys.exit(0 if ok else 1)'; then echo "cluster healthy after $i checks"; break; fi
            sleep 2
          done
          fdbcli "status details" | head -40
          docker exec arca-fdb cat /var/fdb/fdb.cluster > /tmp/fdb.cluster
          cat /tmp/fdb.cluster
      - name: put a sudo docker wrapper on PATH for the test's chaos actions
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/usr/bin/env bash\nexec sudo /usr/bin/docker "$@"\n' > "$HOME/.local/bin/docker"
          chmod +x "$HOME/.local/bin/docker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: metadata restore drill on the three-process cluster (fdbbackup/fdbrestore)
        env:
          ARCA_FDB_TESTS: "1"
          ARCA_FDB_CLUSTER_FILE: /tmp/fdb.cluster
          ARCA_FDB_BACKUP_URL: file:///var/fdb/backup
          ARCA_FDB_BACKUP_CLUSTER_FILE: /var/fdb/fdb.cluster
        run: |
          set -euo pipefail
          # Runs before the failover test: fdbrestore needs an empty database.
          sudo docker exec arca-fdb mkdir -p /var/fdb/backup
          sudo docker exec -d arca-fdb backup_agent -C /var/fdb/fdb.cluster
          ARCA_FDB_BACKUP_CMD="sudo docker exec arca-fdb" \
            cargo test -p arca-lake-testkit --features fdb --test fdb_restore -- --nocapture --test-threads=1
      - name: member moves under FoundationDB process and quorum loss (Phase 3.4 §4)
        env:
          ARCA_FDB_TESTS: "1"
          ARCA_CHAOS_DOCKER: "1"
          ARCA_FDB_CLUSTER_FILE: /tmp/fdb.cluster
        run: "cargo test -p arca-lake-testkit --features fdb --test membership_faults fdb:: -- --nocapture --test-threads=1"
      - name: run the failover test
        env:
          ARCA_FDB_TESTS: "1"
          ARCA_FDB_FAILOVER: "1"
          ARCA_CHAOS_DOCKER: "1"
          ARCA_FDB_CLUSTER_FILE: /tmp/fdb.cluster
        run: cargo test -p arca-lake-testkit --features fdb --test fdb_failover -- --nocapture --test-threads=1
      - name: stop the cluster
        if: always()
        run: sudo docker rm -f arca-fdb >/dev/null 2>&1 || true

  # Four short checks in one job: their work takes seconds, and every job
  # on the runner costs about 20 s of setup and teardown.
  checks:
    name: licenses, secrets, DCO, links
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"
      # cargo-deny refreshes the advisory database on every check, so the
      # cache only spares the initial clone; a key per run re-uploaded it
      # every time (about a minute).
      - name: cache cargo-deny and the advisory database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/arca-lake/cargo-deny
            ~/.cargo/advisory-dbs
          key: cargo-deny-${{ runner.os }}-0.20.2
      - name: install cargo-deny (pinned release)
        env:
          DENY_VERSION: 0.20.2
        run: |
          set -euo pipefail
          dir="$HOME/.cache/arca-lake/cargo-deny"; mkdir -p "$dir"
          if [ ! -x "$dir/cargo-deny" ]; then
            base="https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}"
            curl -sSL -o deny.tar.gz "${base}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            tar -xzf deny.tar.gz --strip-components=1 -C "$dir" "cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          fi
          echo "$dir" >> "$GITHUB_PATH"
      - run: cargo-deny check
      # The gitleaks GitHub Action fails on the first push of a branch
      # (empty "before" SHA), so run the pinned CLI directly and scan the
      # full history plus the working tree.
      - name: cache gitleaks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/arca-lake/gitleaks
          key: gitleaks-${{ runner.os }}-8.30.1
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          dir="$HOME/.cache/arca-lake/gitleaks"; mkdir -p "$dir"
          if [ ! -x "$dir/gitleaks" ]; then
            base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
            curl -sSL -o gitleaks.tar.gz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            curl -sSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
            grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt \
              | sed "s#gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz#gitleaks.tar.gz#" \
              | sha256sum -c -
            tar -xzf gitleaks.tar.gz -C "$dir" gitleaks
          fi
          echo "$dir" >> "$GITHUB_PATH"
      - name: scan git history
        run: gitleaks git --no-banner --redact --verbose --exit-code 1 .
      - name: scan working tree
        run: gitleaks dir --no-banner --redact --verbose --exit-code 1 .
      - name: scan measurement artifacts for environment identifiers
        run: python3 -I benchmarks/linux/sanitize.py --check benchmarks/linux/results benchmarks/reports docs
      - name: check Signed-off-by trailers
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            # Direct pushes to main: every commit of the push. A force push
            # or a new branch has no usable "before"; fall back to HEAD only.
            head="$PUSH_AFTER"
            if git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then base="$PUSH_BEFORE"; else base="$head~1"; fi
          fi
          missing=0
          for c in $(git rev-list "$base..$head"); do
            if ! git show -s --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "missing Signed-off-by: $c"
              missing=1
            fi
          done
          exit $missing
      - name: check markdown links (lychee, pinned image)
        run: |
          set -euo pipefail
          sudo docker run --rm -v "$PWD:/input:ro" -w /input lycheeverse/lychee@sha256:eaff3e0a13603c9a701accfcc84f44158bb77bf36ecfa4622b626056c3463892 \
            --no-progress --offline './**/*.md'
